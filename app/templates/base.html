<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nuvibù Studio{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/nuvibu-avatar.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Salta al contenuto</a>
<header class="topbar">
  <a class="brand" href="/">
    <img class="brand-logo" src="/static/nuvibu-avatar.png" alt="Emma, protagonista di Nuvibù">
    <span><strong>Nuvibù Studio</strong><small>EMMA &amp; FRIENDS</small></span>
  </a>
  <nav aria-label="Navigazione principale">
    <a href="/growth">Growth Lab</a>
    <a class="button button-primary nav-new" href="/episodes/new" aria-label="Nuovo episodio">
      <span class="nav-new-icon" aria-hidden="true">+</span>
      <span class="nav-new-label">Nuovo episodio</span>
    </a>
    <span class="mode {{ 'mode-live' if settings.provider_mode == 'live' else '' }}">
      {{ 'LIVE • COSTI ATTIVI' if settings.provider_mode == 'live' else 'MOCK • SENZA COSTI' }}
    </span>
    <form class="logout-form" action="/logout" method="post">
      <button class="button button-quiet" type="submit">Esci</button>
    </form>
  </nav>
</header>
<main class="page" id="main-content">{% block content %}{% endblock %}</main>
<footer>Console privata • revisione umana obbligatoria • upload YouTube inizialmente privato</footer>
</body>
</html>
