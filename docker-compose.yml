services:
  web:
    build: .
    env_file: .env
    environment:
      RUNTIME_ROLE: web
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/nuvibu.db}
      STORAGE_ROOT: /data/storage
    ports: ["8000:8080"]
    volumes:
      - ./runtime:/data
      - ./secrets:/app/secrets
  worker:
    build: .
    env_file: .env
    environment:
      RUNTIME_ROLE: worker
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/nuvibu.db}
      STORAGE_ROOT: /data/storage
    command: ["python", "scripts/run_worker.py"]
    healthcheck:
      disable: true
    volumes:
      - ./runtime:/data
      - ./secrets:/app/secrets
